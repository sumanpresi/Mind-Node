<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>MindNote — visual thinking</title>
<meta name="description" content="A mind map and outline workspace that runs in your browser." />
<meta name="theme-color" content="#14142b" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b4ce0'/><circle cx='11' cy='16' r='4' fill='white'/><circle cx='23' cy='9' r='3' fill='%23f0b429'/><circle cx='23' cy='23' r='3' fill='%232fb6b0'/><path d='M13 14 L21 10 M13 18 L21 22' stroke='white' stroke-width='1.6' fill='none'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>

<div id="app" data-theme="light">

  <nav id="rail" aria-label="Quick actions">
    <span class="rail-mark" aria-hidden="true"></span>
    <button class="rail-btn" id="railOpen" title="Show documents" aria-label="Show documents">
      <svg viewBox="0 0 20 20" class="ic"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <button class="rail-btn" id="railSearch" title="Search" aria-label="Search">
      <svg viewBox="0 0 20 20" class="ic"><circle cx="9" cy="9" r="5"/><path d="M13 13l4 4"/></svg>
    </button>
    <button class="rail-btn" id="railNew" title="New document" aria-label="New document">
      <svg viewBox="0 0 20 20" class="ic"><path d="M10 4v12M4 10h12"/></svg>
    </button>
    <button class="rail-btn" id="railTheme" title="Theme" aria-label="Theme">
      <svg viewBox="0 0 20 20" class="ic"><circle cx="10" cy="10" r="6"/><path d="M10 4a6 6 0 000 12z" fill="currentColor" stroke="none"/></svg>
    </button>
    <span class="rail-spacer"></span>
    <button class="rail-btn" id="railSync" title="Sync" aria-label="Sync" data-state="off">
      <span class="sync-dot"></span>
    </button>
  </nav>

  <!-- ============ documents sidebar ============ -->
  <aside id="sidebar" aria-label="Documents">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">MindNote</span>
      </div>
      <button class="icon-btn" id="closeSidebar" title="Hide documents" aria-label="Hide documents">✕</button>
    </div>

    <div class="side-search">
      <input id="search" type="search" placeholder="Search all documents" autocomplete="off" />
    </div>

    <div id="searchResults" class="search-results" hidden></div>

    <div class="side-scroll">
      <div class="side-label">Documents</div>
      <ul id="docList" class="doc-list"></ul>
    </div>

    <div class="side-foot">
      <button class="ghost-btn" id="newDoc">New document</button>
      <div class="foot-row">
        <button class="ghost-btn small" id="exportAll">Export</button>
        <button class="ghost-btn small" id="importBtn">Import</button>
        <button class="ghost-btn small" id="themeBtn">Dark</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button class="sync-strip" id="syncBtn" data-state="off">
        <span class="sync-dot"></span><span class="sync-text">Sync is off</span>
      </button>
    </div>
  </aside>

  <!-- ============ main ============ -->
  <main id="main">

    <header id="topbar">
      <button class="icon-btn" id="openSidebar" title="Documents" aria-label="Documents">
        <svg viewBox="0 0 20 20" class="ic"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>

      <div class="doc-title" id="docTitle" contenteditable="true" spellcheck="false"></div>

      <div class="seg" role="tablist" aria-label="View">
        <button class="seg-btn is-on" data-view="map" role="tab">Map</button>
        <button class="seg-btn" data-view="outline" role="tab">Outline</button>
      </div>

      <div class="strip" id="strip">
        <div class="acts" id="acts">
          <button class="icon-btn hist" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg viewBox="0 0 20 20" class="ic"><path d="M7 7L4 10l3 3"/><path d="M4 10h7.5a3.5 3.5 0 010 7H9"/></svg>
          </button>
          <button class="icon-btn hist" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
            <svg viewBox="0 0 20 20" class="ic"><path d="M13 7l3 3-3 3"/><path d="M16 10H8.5a3.5 3.5 0 000 7H11"/></svg>
          </button>
          <div class="tool-sep"></div>
          <button class="icon-btn act" data-act="child" title="Add child (Tab)" aria-label="Add child">
            <svg viewBox="0 0 20 20" class="ic"><rect x="2" y="6.5" width="7" height="7" rx="2"/><path d="M9 10h2.5"/><path d="M14.5 7.5v5M12 10h5"/></svg>
          </button>
          <button class="icon-btn act" data-act="sibling" title="Add sibling (Enter)" aria-label="Add sibling">
            <svg viewBox="0 0 20 20" class="ic"><rect x="6.5" y="2" width="7" height="7" rx="2"/><path d="M10 9v2.5"/><path d="M7.5 14.5h5M10 12v5"/></svg>
          </button>
          <button class="icon-btn act" data-act="fold" title="Fold or unfold" aria-label="Fold or unfold">
            <svg viewBox="0 0 20 20" class="ic"><path d="M6 4.5l4 4 4-4"/><path d="M6 11.5l4 4 4-4"/></svg>
          </button>
          <button class="icon-btn act" id="connectBtn" data-act="connect" title="Connect to another node" aria-label="Connect to another node">
            <svg viewBox="0 0 20 20" class="ic"><path d="M8 12l4-4"/><path d="M11.5 5.5a3 3 0 014.2 4.2l-1.8 1.8"/><path d="M8.5 14.5a3 3 0 01-4.2-4.2l1.8-1.8"/></svg>
          </button>
          <button class="icon-btn act danger-btn" data-act="delete" title="Delete node" aria-label="Delete node">
            <svg viewBox="0 0 20 20" class="ic"><path d="M4 6h12"/><path d="M8 6V4h4v2"/><path d="M6 6l.8 10h6.4L14 6"/></svg>
          </button>
        </div>

        <div class="tool-sep"></div>

        <div class="tools" id="tools">
          <button class="icon-btn tool" data-toggle="showTasks" title="Tasks">
            <svg viewBox="0 0 20 20" class="ic"><circle cx="10" cy="10" r="7"/><path d="M6.8 10.2l2.2 2.2 4.2-4.6"/></svg>
          </button>
          <button class="icon-btn tool" data-toggle="showNotes" title="Notes">
            <svg viewBox="0 0 20 20" class="ic"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 7h6M7 10h6M7 13h4"/></svg>
          </button>
          <button class="icon-btn tool" data-toggle="showImages" title="Images, stickers and emoji">
            <svg viewBox="0 0 20 20" class="ic"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.4"/><path d="M4 14l4-4 3.5 3.5L14 11l2 2"/></svg>
          </button>
          <button class="icon-btn tool" data-toggle="showTags" title="Tags">
            <svg viewBox="0 0 20 20" class="ic"><path d="M3 8.5V4h4.5l8.5 8.5-4.5 4.5L3 8.5z"/><circle cx="6.6" cy="6.6" r="1.1"/></svg>
          </button>
          <button class="icon-btn tool" data-toggle="focusMode" title="Focus mode">
            <svg viewBox="0 0 20 20" class="ic"><circle cx="10" cy="10" r="3"/><path d="M3 6V3h3M17 6V3h-3M3 14v3h3M17 14v3h-3"/></svg>
          </button>
          <button class="icon-btn tool" id="foldBtn" title="Fold everything">
            <svg viewBox="0 0 20 20" class="ic"><path d="M4 10h9"/><path d="M13 7l3 3-3 3"/></svg>
          </button>
          <select id="layoutSel" class="mini-sel" title="Layout" aria-label="Layout">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
            <option value="compact">Compact</option>
            <option value="radial">Radial</option>
            <option value="manual">Manual</option>
          </select>
        </div>
      </div>

      <button class="icon-btn" id="inspectorBtn" title="Style inspector" aria-label="Style inspector">
        <svg viewBox="0 0 20 20" class="ic"><path d="M4 15l6.5-6.5"/><path d="M12 3.5l4.5 4.5-3 3-4.5-4.5z"/><path d="M4 15v1.5h1.5"/></svg>
      </button>
    </header>

    <div id="stage">

      <!-- map -->
      <div id="canvas" tabindex="0">
        <div id="world">
          <svg id="edges" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 z" style="fill:var(--link)"/>
              </marker>
            </defs>
            <g id="edgeLayer"></g>
            <g id="linkLayer"></g>
          </svg>
          <div id="nodes"></div>
        </div>

        <div id="zoombar">
          <button class="zb" id="zoomOut" aria-label="Zoom out">−</button>
          <button class="zb wide" id="zoomFit">Fit</button>
          <button class="zb" id="zoomIn" aria-label="Zoom in">+</button>
        </div>

        <div id="connectHint" class="hint" hidden>Pick the first node, then the second.</div>
      </div>

      <!-- outline -->
      <div id="outline" hidden></div>

      <!-- inspector -->
      <aside id="inspector" aria-label="Inspector">
        <div class="pane-head">
          <span id="inspTitle">Style</span>
          <button class="icon-btn" id="closeInspector" aria-label="Close inspector">✕</button>
        </div>
        <div class="pane-body" id="inspBody"></div>
      </aside>

    </div>

    <!-- node sheet: the touch counterpart of the inspector -->
    <div id="sheet" hidden></div>

  </main>

  <div id="scrim" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
</div>

<script src="app.js?v=8"></script>
<script src="sync.js?v=8"></script>
</body>
</html>
